[workspace]
resolver = "2"
members = ["core", "python", "node", "cabi"]

[workspace.dependencies]
ormcore-core = { path = "core" }
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
chrono = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1

# sqlx 0.9 never sets TCP_NODELAY; see patches/README.md.
[patch.crates-io]
sqlx-core = { path = "patches/sqlx-core" }
