[package]
name = "ormcore-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ormcore-core.workspace = true
chrono.workspace = true
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "chrono_date"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
