[package]
name = "orm-rust-compare"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
orm-core = { path = "../../core" }
orm-engine = { path = "../../engine" }
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-chrono", "with-uuid", "with-bigdecimal", "postgres-array"] }
sea-query = "1.0"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
diesel = { version = "=2.3.13", default-features = false, features = ["postgres"] }
diesel-async = { version = "=0.9.2", features = ["postgres", "deadpool"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
futures-util = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
