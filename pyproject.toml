[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orm"
version = "0.1.0"
description = "Async Python ORM with a Rust core"
requires-python = ">=3.11"

[project.optional-dependencies]
postgres = ["orm-native-postgres==0.1.0"]
sqlite = ["orm-native-sqlite==0.1.0"]
combined = ["orm-native-combined==0.1.0"]
tooling = ["orm-native-tooling==0.1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "pyright"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
orm = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["examples"]

[tool.mypy]
strict = true
mypy_path = "python:examples"

# `python -m orm ...` from the repo root works on the blog example.
[tool.orm]
schema = "examples/blog/schema.prisma"
migrations = "examples/blog/migrations"
