id = "orm.generic"
version = "0.1.0"
host_contract = 1
schema_contract = 1
languages = ["python", "typescript"]
databases = ["postgres", "sqlite"]
capabilities = ["schema-transformations", "physical-schema", "generic-relations"]

[[attributes]]
name = "generic.relation"
target = "model"
positional = [{ kind = "string", required = true }]
[attributes.arguments]
type = { kind = "string", required = true }
key = { kind = "string", required = true }
targets = { kind = "list", required = true }

# The field form: `target Generic? @generic.relation(targets: [...])` creates the pair fields.
[[attributes]]
name = "generic.relation"
target = "field"
[attributes.arguments]
targets = { kind = "list", required = true }
type = { kind = "string" }
key = { kind = "string" }
index = { kind = "boolean" }

[[attributes]]
name = "generic.reverse"
target = "field"
[attributes.arguments]
relation = { kind = "string" }

[[passes]]
id = "orm.generic.prepare"
phase = "behavior"
rust = "crate::prepare"
effects = ["behavior.generic_relations", "behavior.generic_reverse", "storage.generic_checks"]
