[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "orm-native-combined"
version = "0.1.0"
requires-python = ">=3.11"
description = "Statically compiled ORM combined engine"

[tool.maturin]
manifest-path = "../../../bindings/python/Cargo.toml"
python-source = "."
module-name = "orm_native_combined._native"
no-default-features = true
features = ["pyo3/extension-module", "profile-combined"]
