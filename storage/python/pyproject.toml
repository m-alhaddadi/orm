[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orm-storage"
version = "0.1.0"
description = "Independent streaming object storage and durable references"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
s3 = ["aiobotocore>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orm_storage = ["py.typed"]
