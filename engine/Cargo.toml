[package]
name = "orm-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Query planner and database drivers shared by the language bindings. No binding code."

[lib]
name = "orm_engine"

[dependencies]
orm-core = { path = "../core", default-features = false }
# SQL building: one builder per dialect (multi-database support lives here).
sea-query = { version = "1.0", default-features = false, features = ["with-chrono", "with-json", "with-uuid", "with-bigdecimal", "postgres-array", "thread-safe", "hashable-value"] }
# Postgres driver (see src/db/postgres.rs).
tokio-postgres = { optional = true, version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres-rustls = { optional = true, version = "0.14", default-features = false, features = ["ring"] }
rustls = { optional = true, version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
bytes = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = "1"
bigdecimal = "0.4"
sha2 = "0.10"

rusqlite = { optional = true, version = "0.37", features = ["bundled"] }
blake2 = "0.10"

[features]
default = ["postgres", "sqlite"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots", "dep:bytes", "sea-query/backend-postgres"]
sqlite = ["dep:rusqlite", "sea-query/backend-sqlite"]
composition = ["orm-core/composition"]

[dev-dependencies]
tokio = { version = "1", features = ["time"] }
