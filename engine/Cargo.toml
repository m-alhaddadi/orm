[package]
name = "orm-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Query planner and database drivers shared by the language bindings. No binding code."

[lib]
name = "orm_engine"

[dependencies]
orm-core = { path = "../core" }
# SQL building: one builder per dialect (multi-database support lives here).
sea-query = { version = "1.0", features = ["backend-postgres", "with-chrono", "with-json", "with-uuid", "with-bigdecimal", "postgres-array", "thread-safe", "hashable-value"] }
# Postgres driver (see src/db/postgres.rs).
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = "1"
bigdecimal = "0.4"
