[package]
name = "orm-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Language-independent ORM core: schema language, IR, extensions, migrations, code generation. No binding code."

[lib]
name = "orm_core"

[dependencies]
orm-contracts = { path = "../contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
storage-reference = { path = "../storage/reference", optional = true }

[features]
default = ["generate-python", "generate-typescript"]
generate-python = []
generate-typescript = []
composition = []
file-storage = ["dep:storage-reference"]
reference-loading = []
