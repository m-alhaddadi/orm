[package]
name = "orm-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Language-independent ORM core: schema language, IR, extensions, migrations, code generation. No binding code."

[lib]
name = "orm_core"

[[bin]]
name = "orm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
